schema_version: 1
plan_status: draft
authoritative_note: >
  This plan is intentionally conservative. Replace or extend blocks only from
  authoritative specifications, dependency maps, freeze reports, and approved
  architecture review. Do not infer missing product scope from chat history.

protected_foundations:
  - id: F-01
    status: frozen
  - id: F-02
    status: frozen
  - id: F-03
    status: frozen
  - id: F-04
    status: frozen   # reconciled 2026-07-25: frozen (DECISIONS.md ADR-025, F-04_FREEZE_REPORT.md)

blocks:
  - id: CTRL-01
    name: Autonomous Build Controller
    type: internal_tooling
    status: completed   # 2026-07-25: v1 approved for operation (DECISIONS.md ADR-026)
    depends_on:
      - F-04
    authoritative_sources:
      - specification/automation/AUTONOMOUS_BUILD_CONTROLLER.md
      - specification/automation/AUTONOMY_POLICY.md
      - specification/automation/HUMAN_ESCALATION_POLICY.md
      - specification/automation/VERIFICATION_MANIFEST.yml
      - Decision Ledger
      - F-01 through F-04 freeze records
    scope:
      - controller state machine
      - provider adapters
      - worktree lifecycle
      - structured agent outputs
      - deterministic verification
      - independent review flow
      - bounded repair loop
      - human escalation and resume
      - synthetic end-to-end proof
    out_of_scope:
      - real S-05 product implementation
      - automatic merge to protected branch
      - production deployment
      - production credentials or customer data
    acceptance_criteria:
      - all controller state transitions are explicit and validated
      - every agent invocation is bounded and schema-constrained
      - protected branch remains untouched during synthetic proof
      - malformed model output is rejected
      - prohibited commands are blocked
      - duplicate controller runs are locked out
      - interrupted runs resume safely
      - retry exhaustion stops cleanly
      - unavailable reviewer yields controlled blocked state
      - secrets are redacted from logs
      - synthetic tranche reaches ready_for_review
    required_verification:
      - controller_unit
      - controller_integration
      - controller_policy
      - controller_crash_recovery
      - controller_locking
      - controller_end_to_end_synthetic
      - repository_security
      - repository_architecture
    human_gate_before: false
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - controller implementation
      - schemas
      - run records
      - synthetic proof
      - controller freeze report
      - proposed first S-05 pilot tranche

  # Reconciled 2026-07-25 from the placeholder S-05-PILOT into the real first S-05
  # tranche, derived from authoritative repository sources (not chat): the
  # CONTROLLER_FREEZE_REPORT proposal, contracts/S-05.json (MTX-028/051/056/071),
  # APPLICATION_LAYER.md § WF-003 (DEF-1 command vocabulary, ADR-024) and
  # SCORE_EVIDENCE_MODEL.md § Ownership-Verification Evidence Contract. Owner
  # approval to run the first pilot was given ("Run S-05-001"), clearing the
  # human_gate_before; the human_gate_after (owner review before merge) stands.
  - id: S-05-001
    name: Ownership Verification — IssueVerificationChallenge (WF-003, first limb)
    type: product
    status: completed   # 2026-07-26: owner-accepted and merged into implementation/s01-registration-access (d35a4c9)
    depends_on:
      - CTRL-01
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-ii/APPLICATION_LAYER.md#wf-003-verify-property-ownership-or-control
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#ownership-verification-evidence-contract
      - specification/volume-i/OWNER_DECISION_REGISTER.md OD-001 (ratified, ADR-019)
      - specification/volume-ii/SECURITY_PERFORMANCE.md PRULE-005, PRULE-020
      - CONTROLLER_FREEZE_REPORT.md (proposed pilot)
    scope:
      - the verification_requests aggregate table (RLS, lifecycle guard, method CHECK, one-pending-per-Source)
      - Workflows::Wf003::IssueVerificationChallenge command + handler + challenge grammar + ledger + store
      - challenge token issuance protected behind F-02 (Platform::Encryption), never persisted in plaintext
      - the 24-hour verification_request_expire scheduled through F-04 (ScheduledActions catalogue)
      - SourceVerificationRequested event, restricted audit, idempotent replay returning the same token
      - the source.verify Permission Baseline row and the S-05 ErrorCatalog reasons
      - deployment substrate for F-02's first consumer (dev/test key ring + f1:db:ensure_encryption_key)
    out_of_scope:
      - DNS/HTTP observation (Reserve/Complete), scoring/evaluation (CAP-013/S-09)
      - Source lifecycle transition proposed->verified (later observation-completion limb)
      - expiry/cancel/fail execution and cryptographic deletion (later limbs)
      - frozen foundation contract changes, destructive migrations, production deployment, automatic merge
    acceptance_criteria:
      - an authorized OrganizationAdmin or TechnicalImplementer issues a challenge for a proposed Source
      - the Request + encrypted challenge reference + digest + scheduled 24h expiry persist atomically
      - the plaintext token is returned only in the authorized response and appears in no column/log/event/audit
      - exact replay while pending returns the same token; a second request for the Source is verification_in_progress
      - an unsupported method is rejected before any token is issued (PRULE-020)
      - the Source stays proposed and no SourceVerified event is emitted
      - full suite + DB permissions/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
      - repository_security
    human_gate_before: false   # cleared by owner instruction "Run S-05-001" (first-pilot approval)
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the verification_requests migration + structure.sql
      - the Wf003 IssueVerificationChallenge slice + specs
      - S-05-001 completion report + DECISIONS ledger entry

  # Designated by the owner (2026-07-26, DECISIONS.md ADR-029) as the next WF-003
  # limb; human_gate_before cleared by that designation. Scope derived from
  # contracts/S-05.json (MTX-028/MTX-005/MTX-051) and SCORE_EVIDENCE_MODEL.md
  # § Attempts, Expiry, And Evidence.
  - id: S-05-002
    name: Ownership Verification — ExpireVerificationRequest (WF-003 expiry limb)
    type: product
    status: completed   # 2026-07-26: owner-accepted and merged into implementation/s01-registration-access (92eb065)
    depends_on:
      - S-05-001
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-ii/APPLICATION_LAYER.md#wf-003-verify-property-ownership-or-control
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#ownership-verification-evidence-contract
    scope:
      - Workflows::Wf003::ExpireVerificationRequest — the service-executed handler for the
        due verification_request_expire ScheduledAction that S-05-001 schedules
      - pending -> expired with reason challenge_expired at expires_at_utc; SourceVerificationExpired event
      - challenge redelivery made unavailable immediately and the challenge material destroyed (F-02 erase)
      - relax the verification_requests lifecycle guard for exactly the pending -> expired edge
      - closes the dangling verification_request_expire action left by S-05-001
    out_of_scope:
      - DNS/HTTP observation (Reserve/Complete), Source proposed->verified transition, scoring
      - cancellation and integrity-failure limbs (Cancel/Fail)
      - frozen foundation contract changes, destructive migrations, production deployment, automatic merge
    acceptance_criteria:
      - a due verification_request_expire action transitions a still-pending Request to expired/challenge_expired
      - SourceVerificationExpired is emitted exactly once; the Source remains proposed
      - the challenge ciphertext is erased and redelivery is unavailable after expiry; the digest and audit survive
      - expiry is executed only by the named lifecycle service; a non-pending Request is a no-op/idempotent
      - full suite + DB permissions/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
      - background_execution
    human_gate_before: false   # cleared by owner designation (ADR-029)
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the ExpireVerificationRequest slice + specs
      - S-05-002 completion report + DECISIONS ledger entry

  # OWNER-ACCEPTED SPLIT (2026-07-26, DECISIONS.md ADR-032 approved by ADR-033). The Observation
  # limb is decomposed into the authoritative sequence S-05-003..S-05-007 below. S-05-003 is
  # authorised to run next; S-05-004..007 remain human_gate_before until authorised in turn.
  # Original proposal rationale:
  # The owner designated S-05-003 as "Observation (Reserve + Complete)". Pre-implementation
  # scoping against contracts/S-05.json (MTX-028/051), SCORE_EVIDENCE_MODEL.md § Attempts,
  # Expiry, And Evidence, and schemas/POSTGRESQL_SCHEMA.md :288 shows the Observation limb is
  # far too large for one coherent, reviewable tranche: it spans a full SSRF-safe outbound
  # observation engine (F-01), a new verification_attempts WORK-CLAIM table + reservation, the
  # Evidence-producing completion (F-03), the atomic multi-root success commit, source-scope-
  # interim-v1 materialization (the Source Scope sub-system, S-06 territory), and the 10-slot
  # automated schedule. Per the owner's instruction, the controller stops before implementation
  # and proposes this split into five smaller authorised tranches. Each is human_gate_before
  # until the owner approves the split and authorises the first. Order = dependency order.
  - id: S-05-003
    name: Ownership Verification — outbound observation engine (WF-003, F-01 consumer)
    type: product
    status: ready_for_review   # 2026-07-26: implemented, verified, independently reviewed; not merged
    depends_on:
      - S-05-002
    authoritative_sources:
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#dns-txt-method
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#http-file-method
      - specification/volume-ii/contracts/S-05.json
    scope:
      - a pure observation engine (PORO/adapter) given (method, canonical_host, token) -> outcome
      - DNS TXT via Platform::Outbound.fetch_dns_txt (_f1-verify.<host>; exact ASCII match; segment
        concatenation; case/whitespace fail; observed_value_sha256; null hash on absent; resolver reasons)
      - HTTPS file via Platform::Outbound.fetch (/.well-known/f1-verification.txt; 200 + <=4KiB + trailing-LF;
        the 4096/4097 byte boundary + hashing; no redirects; status mapping)
      - the 14 observation reason codes + network-outcome + match-decision vocabulary
    out_of_scope:
      - persistence, attempt reservation, Evidence, any Source/Request transition (later sub-tranches)
      - frozen foundation contract changes, destructive migrations, production deployment
    acceptance_criteria:
      - each DNS/HTTP predicate + hashing + boundary rule matches the contract exactly (fixtures)
      - consumes only the frozen F-01 façade; no second egress path
      - full suite + architecture fitness green
    required_verification:
      - complete_test_suite
      - architecture_fitness
      - repository_security
    human_gate_before: false   # cleared by owner (ADR-033); authorised to run next
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
    expected_outputs:
      - the observation engine + fixtures
      - S-05-003 completion report + DECISIONS entry

  - id: S-05-004
    name: Ownership Verification — verification_attempts + ReserveVerificationAttempt
    type: product
    status: not_started   # authoritative sequence (ADR-033); human_gate_before until authorised in turn
    depends_on:
      - S-05-003
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#attempts-expiry-and-evidence
      - schemas/POSTGRESQL_SCHEMA.md
    scope:
      - the verification_attempts table (reserved/running/completed/quarantined; automated/on_demand;
        slot offset; outcome columns; unique (verification_request_id, attempt_number); RLS + guard)
      - ReserveVerificationAttempt — atomic attempt id + count increments + in-progress marker,
        serialized on the Request
      - the on-demand guards on_demand_limit_reached(10) / on_demand_observation_in_progress / on_demand_rate_limited(5min)
    out_of_scope:
      - running the observation, Evidence, the success commit, the slot schedule
      - frozen foundation contract changes, destructive migrations, production deployment
    acceptance_criteria:
      - a reserved attempt increments the counts and marker atomically; concurrent reserves cannot share a slot
      - the three on-demand denials hold at their exact boundaries; attempt_count never increments on a rejection
      - full suite + DB permissions/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
    human_gate_before: true
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the verification_attempts migration + Reserve slice + specs

  - id: S-05-005
    name: Ownership Verification — CompleteVerificationAttempt (observation recording, F-03)
    type: product
    status: not_started   # authoritative sequence (ADR-033); human_gate_before until authorised in turn
    depends_on:
      - S-05-004
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#attempts-expiry-and-evidence
    scope:
      - CompleteVerificationAttempt — run the S-05-003 engine for a reserved attempt (provider call
        outside the transaction; only the recorded outcome committed)
      - exactly one restricted verification_observation Evidence (F-03) per started observation
      - SourceVerificationObserved event; Request completion/last-observed update; marker cleared
      - idempotent retry under the reserved attempt (no second count); NON-verifying outcomes leave the Source proposed
    out_of_scope:
      - the matched success commit + Source proposed->verified + scope materialization (S-05-006)
      - the automated slot schedule (S-05-007)
      - frozen foundation contract changes, destructive migrations, production deployment
    acceptance_criteria:
      - each started observation persists exactly one restricted verification_observation Evidence with no plaintext token/raw content
      - a not_matched/indeterminate/dependency-failure outcome records the observation and leaves the Source proposed
      - completion-persistence-failure retries the same reserved attempt and consumes no second count
      - full suite + DB/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
    human_gate_before: true
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the CompleteVerificationAttempt recording slice + specs

  - id: S-05-006
    name: Ownership Verification — matched success commit + source-scope-interim-v1
    type: product
    status: not_started   # authoritative sequence (ADR-033); human_gate_before until authorised in turn
    depends_on:
      - S-05-005
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#attempts-expiry-and-evidence
    scope:
      - on a matched observation, the atomic multi-root commit (Request verified/matched, redelivery disablement, SourceVerified, Source.proposed to verified with the sources guard relaxed for that edge)
      - materialization of source-scope-interim-v1 in the same transaction (SourceScopePolicyRepository)
      - none-may-appear-without-the-others proven; the transition fires exactly once (state-version guarded)
    out_of_scope:
      - the automated slot schedule (S-05-007), scoring/evaluation, Source activation (S-06 lifecycle)
      - frozen foundation contract changes, destructive migrations, production deployment
    acceptance_criteria:
      - all success work items commit together or not at all (a fixture proves none appears without the others)
      - concurrent matched completions transition once; a stale Source state version rejects with no side effect
      - full suite + DB/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
    human_gate_before: true
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    open_questions:
      - >
        ARCHITECTURAL DEPENDENCY (owner): source-scope-interim-v1 materialization needs a Source Scope
        Policy artifact (SourceScopePolicyRepository), which is the Source Scope sub-system (S-06
        territory: source_set_versions/source_set_memberships/source_scope_change_requests). Decide
        whether the minimal materialization artifact is built here for the success commit, or is an S-06
        prerequisite that must precede S-05-006. This may require its own foundation-style sequencing.
    expected_outputs:
      - the matched success-commit slice + scope-policy materialization + specs

  - id: S-05-007
    name: Ownership Verification — automated observation slot schedule
    type: product
    status: not_started   # authoritative sequence (ADR-033); human_gate_before until authorised in turn
    depends_on:
      - S-05-006
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#attempts-expiry-and-evidence
    scope:
      - the automated slots at 0,5,15,30,60,120,240,480,960,1380 minutes, each in its half-open window
      - AutomatedObservationSlotJob per due slot (reserve + complete an automated attempt via F-04)
      - observation_slot_skipped recorded once, never late; exact-boundary earlier-skipped/later-eligible;
        terminal request state cancels remaining slots without skipped events
    out_of_scope:
      - frozen foundation contract changes, destructive migrations, production deployment
    acceptance_criteria:
      - each slot starts only in its half-open window; an unstarted slot is skipped once and never runs late
      - a terminal Request cancels remaining slots without skipped events
      - full suite + background-execution + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - background_execution
      - migration_safety_no_drift
      - architecture_fitness
    human_gate_before: true
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the automated slot schedule + specs
