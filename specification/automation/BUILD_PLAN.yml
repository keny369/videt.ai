schema_version: 1
plan_status: draft
authoritative_note: >
  This plan is intentionally conservative. Replace or extend blocks only from
  authoritative specifications, dependency maps, freeze reports, and approved
  architecture review. Do not infer missing product scope from chat history.

protected_foundations:
  - id: F-01
    status: frozen
  - id: F-02
    status: frozen
  - id: F-03
    status: frozen
  - id: F-04
    status: frozen   # reconciled 2026-07-25: frozen (DECISIONS.md ADR-025, F-04_FREEZE_REPORT.md)

blocks:
  - id: CTRL-01
    name: Autonomous Build Controller
    type: internal_tooling
    status: completed   # 2026-07-25: v1 approved for operation (DECISIONS.md ADR-026)
    depends_on:
      - F-04
    authoritative_sources:
      - specification/automation/AUTONOMOUS_BUILD_CONTROLLER.md
      - specification/automation/AUTONOMY_POLICY.md
      - specification/automation/HUMAN_ESCALATION_POLICY.md
      - specification/automation/VERIFICATION_MANIFEST.yml
      - Decision Ledger
      - F-01 through F-04 freeze records
    scope:
      - controller state machine
      - provider adapters
      - worktree lifecycle
      - structured agent outputs
      - deterministic verification
      - independent review flow
      - bounded repair loop
      - human escalation and resume
      - synthetic end-to-end proof
    out_of_scope:
      - real S-05 product implementation
      - automatic merge to protected branch
      - production deployment
      - production credentials or customer data
    acceptance_criteria:
      - all controller state transitions are explicit and validated
      - every agent invocation is bounded and schema-constrained
      - protected branch remains untouched during synthetic proof
      - malformed model output is rejected
      - prohibited commands are blocked
      - duplicate controller runs are locked out
      - interrupted runs resume safely
      - retry exhaustion stops cleanly
      - unavailable reviewer yields controlled blocked state
      - secrets are redacted from logs
      - synthetic tranche reaches ready_for_review
    required_verification:
      - controller_unit
      - controller_integration
      - controller_policy
      - controller_crash_recovery
      - controller_locking
      - controller_end_to_end_synthetic
      - repository_security
      - repository_architecture
    human_gate_before: false
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - controller implementation
      - schemas
      - run records
      - synthetic proof
      - controller freeze report
      - proposed first S-05 pilot tranche

  # Reconciled 2026-07-25 from the placeholder S-05-PILOT into the real first S-05
  # tranche, derived from authoritative repository sources (not chat): the
  # CONTROLLER_FREEZE_REPORT proposal, contracts/S-05.json (MTX-028/051/056/071),
  # APPLICATION_LAYER.md § WF-003 (DEF-1 command vocabulary, ADR-024) and
  # SCORE_EVIDENCE_MODEL.md § Ownership-Verification Evidence Contract. Owner
  # approval to run the first pilot was given ("Run S-05-001"), clearing the
  # human_gate_before; the human_gate_after (owner review before merge) stands.
  - id: S-05-001
    name: Ownership Verification — IssueVerificationChallenge (WF-003, first limb)
    type: product
    status: completed   # 2026-07-26: owner-accepted and merged into implementation/s01-registration-access (d35a4c9)
    depends_on:
      - CTRL-01
    authoritative_sources:
      - specification/volume-ii/contracts/S-05.json
      - specification/volume-ii/APPLICATION_LAYER.md#wf-003-verify-property-ownership-or-control
      - specification/volume-i/SCORE_EVIDENCE_MODEL.md#ownership-verification-evidence-contract
      - specification/volume-i/OWNER_DECISION_REGISTER.md OD-001 (ratified, ADR-019)
      - specification/volume-ii/SECURITY_PERFORMANCE.md PRULE-005, PRULE-020
      - CONTROLLER_FREEZE_REPORT.md (proposed pilot)
    scope:
      - the verification_requests aggregate table (RLS, lifecycle guard, method CHECK, one-pending-per-Source)
      - Workflows::Wf003::IssueVerificationChallenge command + handler + challenge grammar + ledger + store
      - challenge token issuance protected behind F-02 (Platform::Encryption), never persisted in plaintext
      - the 24-hour verification_request_expire scheduled through F-04 (ScheduledActions catalogue)
      - SourceVerificationRequested event, restricted audit, idempotent replay returning the same token
      - the source.verify Permission Baseline row and the S-05 ErrorCatalog reasons
      - deployment substrate for F-02's first consumer (dev/test key ring + f1:db:ensure_encryption_key)
    out_of_scope:
      - DNS/HTTP observation (Reserve/Complete), scoring/evaluation (CAP-013/S-09)
      - Source lifecycle transition proposed->verified (later observation-completion limb)
      - expiry/cancel/fail execution and cryptographic deletion (later limbs)
      - frozen foundation contract changes, destructive migrations, production deployment, automatic merge
    acceptance_criteria:
      - an authorized OrganizationAdmin or TechnicalImplementer issues a challenge for a proposed Source
      - the Request + encrypted challenge reference + digest + scheduled 24h expiry persist atomically
      - the plaintext token is returned only in the authorized response and appears in no column/log/event/audit
      - exact replay while pending returns the same token; a second request for the Source is verification_in_progress
      - an unsupported method is rejected before any token is issued (PRULE-020)
      - the Source stays proposed and no SourceVerified event is emitted
      - full suite + DB permissions/RLS + architecture fitness green; no structure.sql drift
    required_verification:
      - complete_test_suite
      - migration_safety_no_drift
      - runtime_role_and_rls
      - architecture_fitness
      - repository_security
    human_gate_before: false   # cleared by owner instruction "Run S-05-001" (first-pilot approval)
    human_gate_after: true
    risk_level: high
    allowed_foundation_dependencies:
      - F-01
      - F-02
      - F-03
      - F-04
    expected_outputs:
      - the verification_requests migration + structure.sql
      - the Wf003 IssueVerificationChallenge slice + specs
      - S-05-001 completion report + DECISIONS ledger entry

  - id: S-05-002
    name: Ownership Verification — next WF-003 limb (to be defined from authoritative sources)
    type: product
    status: not_started   # NOT begun; scope defined only from authoritative sources after S-05-001 review
    depends_on:
