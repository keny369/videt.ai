  - id: S-05-007
    name: Ownership Verification — automated observation slot schedule
    type: product
    status: completed   # 2026-07-26: owner-accepted and fast-forward merged into implementation/s01-registration-access (1eadc45); DECISIONS ADR-047 — completes WF-003 (S-05-001..007)
    depends_on:
