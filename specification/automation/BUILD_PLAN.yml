  # ==========================================================================
  # S-06 SOURCE DISCOVERY AND SCOPE (owner-authorised block, DECISIONS ADR-049)
  # --------------------------------------------------------------------------
  # The owner authorised S-06 — Source Discovery and Scope (WF-004) — as the next
  # repository-defined block after the completed S-05 Ownership Verification
  # capability (HD-S05-COMPLETE-NEXT-BLOCK resolved). Authorisation is limited to
  # S-06 and does NOT pre-authorise S-07/S-08/S-09.
  #
  # Authoritative scope: contracts/S-06.json (MTX-029 WF-004, MTX-006 CAP-006,
  # MTX-057 PRULE-006 Source lifecycle, MTX-072 PRULE-021 scope predicate);
  # WORKFLOW_SPECIFICATIONS.md § WF-004 Manage Source Scope + Source Scope Change
  # Contract; SECURITY_PERFORMANCE.md § PRULE-021; APPLICATION_LAYER.md § WF-004 /
  # PRULE-006. S-06 EXTENDS the S-05-006 interim `source_scope_policies`
  # (`source-scope-policy-v1`); it does not migrate or replace it.
  #
  # Pre-implementation scoping shows S-06 is too large for one reviewable tranche
  # (the S-05 precedent, ADR-032/033). It is decomposed into the five dependency-
  # ordered sub-tranches below (analogous to the S-05 split: a pure engine first,
  # then the stateful limbs). Only S-06-001 is authorised to run; S-06-002..005
  # remain human_gate_before until authorised in turn after the prior is accepted
  # and merged. No sub-tranche exceeds the reviewability limits (≤40 files,
  # ≤3,000 diff lines). "Discovery" is scope DEFINITION and control, not crawler
  # URL discovery: WF-004 performs no outbound retrieval (that is CAP-007/WF-005,
  # S-07). Nothing here pulls forward crawl, parsing, inspection or AI machinery.

  - id: S-06-001
    name: Source Discovery and Scope — Source Scope Predicate (PRULE-021, pure)
    type: product
    status: completed   # 2026-07-27: owner-accepted and fast-forward merged into implementation/s01-registration-access (f0b3933); DECISIONS ADR-052. Authorised ADR-049; hardened per owner Option A (ADR-051); all 5 review lenses PASS; HD-S06-001-SCOPE-SEPARATOR RESOLVED
    depends_on:
      - S-05-006
    authoritative_sources:
      - specification/volume-ii/contracts/S-06.json   # MTX-072 (AC-PRULE-021)
      - specification/volume-ii/SECURITY_PERFORMANCE.md#prule-021-source-scope-predicate
      - specification/volume-i/WORKFLOW_SPECIFICATIONS.md   # ascii-host-v1 host contract (WF-004)
      - specification/volume-ii/DECISIONS.md ADR-049 (owner authorisation of S-06)
    scope:
      - a pure PORO scope predicate (`Workflows::Wf004::SourceScopePredicate`) given a candidate
        canonical URL and the active Source Scope Policy intersection -> allowed or a denial reason
      - URL normalization exactly per PRULE-021 — host lowercase ascii-host-v1 (no implementation-side
        IDNA/punycode; a non-ASCII host is out of scope), trailing dot removed; default port removed;
        path dot-segments and unreserved percent-encoding normalized; fragment dropped; userinfo rejected;
        query pairs retained-and-sorted by decoded key then value preserving duplicates
      - the predicate — allowed only when it matches EVERY active policy intersection, at least one
        include prefix, no exclude prefix (exclusion wins over inclusion), and the query rule; path prefix
        matches exactly or at a '/' segment boundary ('/shop' matches '/shop/item', not '/shopping')
      - a deterministic snake_case denial-reason vocabulary consistent with repository conventions
    out_of_scope:
      - persistence, the source_scope_change_requests table, any command/handler, events, migration
        (S-06-002..005); Source lifecycle transitions (S-06-005)
      - the running-Crawl restriction and any S-07 crawl/scheduler behaviour; the predicate is DEFINED
        here and APPLIED by S-07 (contracts/S-06.json MTX-072 rollout)
      - frozen foundation contract changes, destructive migrations, production deployment, automatic merge
    acceptance_criteria:
      - normalization order and each rule match PRULE-021 exactly, asserted by fixtures
      - a URL must pass every active policy intersection; passing one policy and failing another is rejected
      - exclusion wins over inclusion; the '/' segment-boundary prefix rule holds ('/shop' vs '/shopping')
      - a subdomain, alternate apex/www host, non-HTTPS scheme and nondefault port are each out of scope
      - the predicate is pure — the same URL under the same policy version always yields the same decision
      - full suite + architecture fitness green; no structure.sql drift (no schema change)
    required_verification:
      - complete_test_suite
      - architecture_fitness
      - repository_security
    human_gate_before: false   # cleared by owner authorisation of S-06 (ADR-049)
    human_gate_after: true
    risk_level: medium
    allowed_foundation_dependencies: []   # a pure PORO; consumes no foundation
    expected_outputs:
      - the SourceScopePredicate engine + exhaustive fixtures
      - S-06-001 completion report + DECISIONS ledger entry

  # ==========================================================================
  # S-06-002..006 THREE-WAY DECOMPOSITION (owner Option 1, DECISIONS ADR-055/056)
  # Implementation evidence showed the former S-06-002 (table + Propose + classifier
  # + atomic contraction) would reach ~2,500-3,000+ diff lines and bundle three
  # concerns S-05 kept as separate tranches. The owner authorised a 3-way split that
  # isolates the pure classifier (S-05-003 precedent) and the atomic multi-root commit
  # (S-05-006 precedent). The former S-06-004 (Expire) and S-06-005 (lifecycle) are
  # renumbered to S-06-005 and S-06-006. Dependencies, acceptance criteria and human
  # gates are preserved except where the split makes a dependency change necessary.
  # Interim (until S-06-004): a contraction may remain pending rather than
  # auto-activating — a fail-closed implementation interim (S-05-005 -> S-05-006
  # precedent), never represented as final contract behaviour; no provisional
  # alternative activation path is introduced.

  - id: S-06-002
    name: Source Discovery and Scope — Source Scope Change classifier (Option B, pure)
    type: product
    status: ready_for_review   # 2026-07-27: authorised (ADR-053); Option B (ADR-054); Option-1 decomposition (ADR-056); implemented + all 5 review lenses PASS (ADR-057, 22k fuzzer verdicts, 0 bypass); tip e8b6d60
    depends_on:
      - S-06-001
    authoritative_sources:
      - specification/volume-i/WORKFLOW_SPECIFICATIONS.md   # Source Scope Change Contract (:410-421)
      - specification/volume-ii/APPLICATION_LAYER.md#wf-004-manage-source-scope   # dual control is asymmetric (:769-813)
      - specification/volume-ii/DECISIONS.md ADR-054 (owner Option B classifier ruling)
      - specification/volume-ii/contracts/S-06.json   # MTX-029
    scope:
      - a pure PORO classifier (`Workflows::Wf004::ScopeChangeClassification`) given the current active
        policy, a proposed policy and the verified boundary -> :contraction | :expansion | :boundary_violation
      - base classification (owner Option B / ADR-054): a proposal is a CONTRACTION only when its PRULE-021
        admitted URL set is a subset of the current active policy's; any non-strict-subset or mixed change is
        an EXPANSION; fail-closed (inability to prove subset => expansion); PRULE-021 (S-06-001) is the oracle
      - query handling exception: any query-handling change that can INCREASE distinct crawlable canonical-URL
        multiplicity (e.g. allowlist -> retain_all, or widening the retained-key set) is an EXPANSION; a change
        preserving or reducing multiplicity may remain contraction-eligible
      - boundary violations (host/scheme/port beyond the verified boundary) are :boundary_violation, not a
        classification (rejected by the caller through the authoritative failure path)
    out_of_scope:
      - persistence, the source_scope_change_requests table, any command/handler/event/migration (S-06-003+)
      - atomic contraction activation, Decide, Cancel, Expire, Source lifecycle (S-06-004..006)
      - frozen foundation contract changes, destructive migrations, production deployment, automatic merge
    acceptance_criteria:
      - committed fixtures pin admitted URL-set subset, equality, widening and mixed changes; query-handling
        narrowing, equality and widening; fail-closed unprovable cases; boundary violations as errors
      - the classifier is deterministic, side-effect-free and independently testable; no caller-input mutation
      - full suite + architecture fitness green; no structure.sql drift (no schema change)
    required_verification:
      - complete_test_suite
      - architecture_fitness
      - repository_security
    human_gate_before: false   # cleared by owner authorisation (ADR-053) + Option-1 decomposition (ADR-056)
    human_gate_after: true
    risk_level: high   # security-critical dual-control routing predicate
    allowed_foundation_dependencies: []   # a pure PORO; consumes only S-06-001's PRULE-021 predicate
    expected_outputs:
      - the ScopeChangeClassification classifier + committed fixtures (both dimensions)
      - S-06-002 completion report + DECISIONS ledger entry

