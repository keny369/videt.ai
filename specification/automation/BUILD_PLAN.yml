  - id: S-07-012
    name: Crawl Execution — the run driver (scheduler re-entry for dequeue, fetch and discovery)
    # THE MISSING BLOCK, named by the ADR-026 architecture and concurrency lenses at S-07-008.
    # Numbered next-unused; placed HERE because this is its execution order, before the terminal
    # checkpoint has anything to check.
    #
    # S-07-004..008 built the execution surfaces — `Admission#claim_next`, `EnsureRobots`,
    # `DiscoverSitemaps`, `FetchContent` — and NOTHING IN PRODUCTION CALLS ANY OF THEM. The only
    # registered entry point is `crawl_dispatch -> StartCrawl`, which seeds the root frontier and
    # schedules nothing further. Every claim about the run making progress, including S-07-008's
    # FU-9 "re-entry", presupposes this block.
    #
    # MUST provide, within the ratified ScheduledAction catalogue (it is CLOSED — `crawl_fetch_due`
    # is bound to a Fetch Attempt identity, `crawl_dispatch`/`crawl_terminal_deadline` to
    # `crawl_orchestrate`):
    #   - the loop that admits, fetches and discovers until the frontier drains or a bound stops it;
    #   - RE-ENTRY for a host gate left `sitemap_state = 'pending'` by S-07-008's FU-9 hand-back,
    #     honouring the `retry_after` instant the release reports;
    #   - re-entry for `Admission`'s `run_byte_budget_contended` outcome, which is a "come back",
    #     not a limit.
    # Until it exists FU-9 is MITIGATED, not delivered: the write-once false `sitemap_unavailable`
    # is gone, but nothing re-enters.
    #
    # ENTRY ANALYSIS, recorded at S-07-008 acceptance so it is not re-derived. Everything below is
    # read from ratified sources; none of it is a new decision, and the topology is NOT open.
    #
    # 1. THE ORCHESTRATOR CANNOT RUN THE LOOP. BACKGROUND_PROCESSING :377 fixes `crawl_orchestrate`
    #    to `StartCrawl`, `CompleteCrawl`, `FailCrawl` or `CancelCrawl` "selected solely from
    #    persisted Crawl/deadline state", and both `crawl_dispatch` and `crawl_terminal_deadline`
    #    map to it (:197, :199). The loop is therefore a CHAIN, not a driver: :378 gives
    #    `crawl_fetch` -> `RecordFetchAttempt`, "its terminal transaction creates the exact
    #    ingestion or next-frontier action", and :138 makes the first link StartCrawl's
    #    ("one selected persisted fetch attempt, INCLUDING AN IMMEDIATE FIRST ATTEMPT").
    #
    # 2. `crawl_fetch_due` TARGETS A PERSISTED FETCH ATTEMPT — :138's "selected persisted fetch
    #    attempt" and :198's durable idempotency authority, "Fetch Attempt". The attempt row is
    #    created by the admitting transaction, BEFORE its action exists. `target_type` carries no
    #    database vocabulary constraint, so this is a naming choice, but the identity is not.
    #
    # 3. CONCURRENCY IS SPECIFIED, NOT OPEN. SEARCH_CRAWL_RETRIEVAL § Frontier And Deterministic
    #    Selection: "Workers may fetch concurrently, but one coordinator commits discoveries and
    #    budget effects in increasing dequeue key. A completion with a later key waits in
    #    `fetched_pending_commit`; it cannot change selection." That state ALREADY EXISTS in
    #    `crawl_frontier_entries.state` and nothing writes it yet. WORKFLOW_SPECIFICATIONS :454
    #    says the same for accounting: "All run-wide byte, page, and queue admission accounting is
    #    also applied in dequeue sequence."
    #
    # 4. THE RESERVATION RECONCILIATION HAS A DETERMINATE ANSWER, and it is the first thing this
    #    block must do. S-07-008 recorded it: `Admission` reserves run-wide bytes and `FetchContent`
    #    reserves AGAIN for itself, so calling both on one entry double-reserves. :454 requires byte
    #    admission in dequeue sequence; `Admission` is the only surface that holds the frontier
    #    advisory lock across peek -> reserve -> claim, which is exactly what makes its reservation
    #    ordered, and `FetchContent`'s per-attempt reservation is not ordered at all. So ADMISSION
    #    OWNS THE RESERVATION AND FETCHCONTENT MUST CONSUME IT. The care is in :444's retries: three
    #    attempts may run under one admission, and `commit_bytes` releases the unused remainder at
    #    settle, so the reservation must survive the attempt loop and be released once at the
    #    terminal outcome rather than re-taken per attempt. This changes accepted S-07-007 code and
    #    its three spec files; it is a reconciliation the accepted record already assigns here, not
    #    a scope expansion.
    #
    # 5. INGESTION IS NOT THIS BLOCK'S. :378's "exact ingestion ... action" is `ingestion_attempt_due`
    #    and body staging needs S3; both are S-07-010. This block creates the next-frontier link and
    #    leaves the ingestion link to the tranche that owns Documents.
    type: product
    status: completed   # 2026-07-30: accepted (ADR-096). Five owner rulings implemented (ADR-085 FU-16,
                        # ADR-087 FU-18, ADR-089 FU-19, ADR-091 FU-24, ADR-094/ADR-095 FU-25); one
                        # ADR-026 five-lens pass, one three-lens delta pass and three focused reviews,
                        # every confirmed-blocking finding repaired. FU-9 closed by transfer to S-07-009.
    depends_on:
      - S-07-008
    human_gate_before: false
    human_gate_after: false
    risk_level: high
    expected_outputs:
      - the run-driver slice + specs

  - id: S-07-009
    name: Crawl Execution — terminal checkpoint + coverage/completion + CancelCrawl
    # THE FU-9 TRANSFER IS WITHDRAWN BY OWNER RULING (2026-08-04; ADR-120; round-6 blocker R6-4).
    # Recorded rather than deleted, because it was ratified twice and the correction is the point.
    #
    # WHAT THIS BLOCK WAS ASKED TO DO, at S-07-012's acceptance (ADR-096): "DERIVE :450's
    # `sitemap_unavailable` FOR A GATE NO PRODUCTION PATH CAN TERMINALIZE", because
    # `Workflows::Wf005::DiscoverSitemaps` writes that outcome only once the run has expired while
    # `Workflows::Wf005::CrawlDriver` halts on the same wall clock before calling discovery, so a
    # contended `crawl_host_gates` row stays `sitemap_state = 'pending'` for ever.
    #
    # WHY IT IS WITHDRAWN. Volume I WORKFLOW_SPECIFICATIONS.md :450 governs: "IF A DECLARED SITEMAP
    # EXISTS, or the default returns a non-404/410 response, AND no sitemap candidate succeeds after
    # retries/validation, record `sitemap_unavailable`." The obligation asked for the consequent
    # without the antecedent — a gate the run never attempted has neither a declared sitemap that was
    # tried nor a default response to have observed — so it instructed this block to write an
    # observation the contract does not authorise. BUILD_STATE's own FU-9 `note` had already stated
    # exactly that objection while its `closure` field transferred the opposite obligation.
    #
    # WHAT THIS BLOCK OWNS INSTEAD. The COVERAGE consequence, which is real and which the withdrawn
    # obligation was a wrong route to: :458's "any in-scope candidate NOT EVALUATED ... makes coverage
    # partial". An unattempted gate is left exactly as the run left it and counted as
    # `unattempted_discovery`, which lowers coverage and does not touch :452's completion reason.
    # FU-21's attempt-less terminal entry and FU-22's unscheduled `crawl_terminal_deadline` are
    # unaffected and remain this block's.
    #
    # BLOCKING PRECONDITION. A terminal Crawl can carry NULL in both `coverage_status` and
    # `completion_reason` today, and this tranche writes exactly those two columns.
    #
    # The constraint at fault is `crawls_terminal_shape`, NOT `crawls_coverage_status_check`, and
    # the fault is ordinary two-valued logic rather than an UNKNOWN CHECK. `crawls_terminal_shape`'s
    # terminal limb requires only `terminal_at IS NOT NULL`, so `state='completed'` with both
    # columns NULL satisfies every constraint on the table. A NULL-safe rewrite of the enum check TO
    # THE SHAPE PROOF 29 EVALUATES — `coverage_status IS NULL OR coverage_status = ANY (...)` — is a
    # proven no-op: a CHECK admits both the UNKNOWN that `NULL = ANY(ARRAY['full','partial'])` yields
    # and the TRUE that one yields, so applying it would produce a diff, close the item, and leave the
    # hole open. **THE `IS NOT DISTINCT FROM` SPELLING ORIGINALLY PRESCRIBED IS NOT A NO-OP AND IS NOT
    # ADMITTED** (DECISIONS ADR-111, ADR-115; this sixth occurrence was found by the FU-36 repository
    # sweep and was named by no review): its `ANY(...)` form is a PostgreSQL SYNTAX ERROR, and its only
    # valid spelling — the pairwise `NULL IS NOT DISTINCT FROM 'full' OR ... 'partial'` — evaluates to
    # FALSE rather than UNKNOWN, which a CHECK REFUSES, so it would reject every `queued` and `running`
    # Crawl. NULL must be tested independently, because UNKNOWN is admitted and FALSE is not.
    # `schemas/POSTGRESQL_SCHEMA.md` also declares the column nullable, which
    # is what a non-terminal Crawl needs.
    #
    # THE REPAIR is a terminal-completeness conjunct on `crawls_terminal_shape`, scoped by state:
    # every terminal state requires `completion_reason IS NOT NULL`, and `state='completed'`
    # additionally requires `coverage_status IS NOT NULL`. Requiring BOTH on every terminal state is
    # wrong and would break `IdentityAccess::Infrastructure::CrawlStartStore#fail`, which sets
    # `state='failed'` with a completion reason and no coverage — a failed run has no coverage to
    # report. Reconcile the catalogue's nullable declaration with the same rule. See FU-11.
    type: product
    status: pending
    depends_on:
      - S-07-007
      - S-07-008
      # The terminal checkpoint has nothing to check until something advances the run. Encoded as a
      # dependency, not as file position: BUILD_PLAN is a machine-readable graph and the controller
      # reads `depends_on`, so without this S-07 could close at S-07-011 with the driver never built
      # and FU-9 permanently open.
      - S-07-012
    human_gate_before: false
    human_gate_after: false
    risk_level: high
    expected_outputs:
      - the terminal-checkpoint slice + specs

