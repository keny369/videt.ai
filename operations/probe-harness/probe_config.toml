# VIDET probe harness, seed config
# Throwaway operations tooling. Not platform, not specification, not canon.
#
# Everything the harness does is driven from this file. To screen a different
# vertical, copy this file, change [[verticals]] and [[targets]], run again.
#
# Target data below was verified against the firms' own sites and ABN Lookup on
# 6 August 2026. Where a field is empty it is because the source does not state
# it, and that absence is itself recorded in `notes`. Nothing here is inferred.

[run]
date            = "2026-08-06"
operator        = "Lee Powell"
location_note   = "Melbourne, Australia. No VPN. API, not consumer product."
repeats_vertical = 3          # repeats per (vertical question x arm x provider)
repeats_entity   = 2          # repeats per (target x arm x provider)
arms             = ["search", "nosearch"]
concurrency      = 6
followups_on_first_repeat_only = true

# Sent to the provider's web search tool so results are localised.
# If a provider rejects this shape the harness retries without it and records
# the deviation on the run. It never silently drops it.
[run.user_location]
enabled  = true
city     = "Melbourne"
region   = "Victoria"
country  = "AU"
timezone = "Australia/Melbourne"

# The two models being MEASURED. Sonnet 5 runs adaptive thinking by default and
# rejects temperature/top_p/top_k, so neither is sent.
[providers.anthropic]
enabled    = true
model      = "claude-sonnet-5"
max_tokens = 8000
effort     = "medium"

# "GPT-5.5 Instant" is a ChatGPT product-tier label, not an API model id.
# CONFIRMED against the key on 6 Aug 2026: there is NO gpt-5.5-chat-latest. The
# -chat-latest variants stop at 5.3. The 5.5 family is gpt-5.5, its dated pin,
# and gpt-5.5-pro. So Instant is reached as the base 5.5 model held at its
# lowest reasoning effort, which is what the ChatGPT Instant tier is.
#
# Dated pin, not the bare `gpt-5.5` alias, so the model cannot be repointed
# underneath a study in progress and break comparability between runs.
#
# If reasoning_effort is rejected the harness retries without it and records
# the deviation on the run. Check `deviations` in runs.jsonl before reporting
# anything as Instant-tier: without it you measured the default effort instead.
[providers.openai]
enabled           = true
model             = "gpt-5.5-2026-04-23"
# CONFIRMED 6 Aug 2026: "minimal" is rejected on gpt-5.5 (it was the GPT-5
# spelling). Tried in order, first accepted wins, and the winner is written to
# reasoning_effort_used on every run record. An empty list means do not send it.
reasoning_effort_ladder = ["none", "low", "minimal"]
max_output_tokens = 8000

# NOT a measured model. This is the structured-extraction step that turns each
# answer into countable data, on a fresh context. Left on Opus 5 deliberately:
# every count in the report depends on this extraction being right, and it is
# cheap relative to the probe calls. Drop it to sonnet if you want to.
[transcribe]
provider = "anthropic"
model    = "claude-opus-5"
effort   = "low"

# ---------------------------------------------------------------------------
# VERTICALS. Unprimed recommendation probes. These are per category, not per
# target, which is why one pass covers every target in the vertical at once.
# ---------------------------------------------------------------------------

[[verticals]]
id       = "buyers-advocates"
label    = "buyers advocates"
location = "Melbourne"
followups = [
  "Of all of those, which single one would you pick for buying a first investment property in Melbourne, and why?",
  "How do you know about these companies — where does this information come from? Please list the specific pages or sources for each one.",
]

[[verticals.questions]]
id = "BA-1"
archetype = "A"
kind = "recommendation"
text = "Who are the best buyers advocates in Melbourne?"

[[verticals.questions]]
id = "BA-2"
archetype = "B"
kind = "recommendation"
text = "I keep losing at auctions in Melbourne. Is a buyers advocate worth it, and who should I use?"

[[verticals.questions]]
id = "BA-3"
archetype = "G"
kind = "recommendation"
text = "What do buyers advocates charge in Melbourne?"

[[verticals.questions]]
id = "BA-C1"
archetype = "control"
kind = "control_area"
text = "Who are the best buyers advocates in Bendigo?"

# CONTROL NAME VERIFIED 6 Aug 2026 on ABN Lookup: no active entity combines
# "Kestrel" and "Marlowe". The previous candidate (Harper & Vale) was RETIRED
# because HARPER AND VALE BUSINESS SOLUTIONS, ABN 22 943 569 955, is a real
# active VIC entity. Re-check this name before every future run.
[[verticals.questions]]
id = "BA-C2"
archetype = "control"
kind = "control_fabrication"
text = "Tell me about Kestrel & Marlowe Buyers Advocates in Hawthorn. What do they specialise in?"

[[verticals]]
id       = "business-brokers"
label    = "business brokers"
location = "Melbourne"
followups = [
  "Of all of those, which single one would you pick for selling a $3 million Australian business, and why?",
  "How do you know about these companies — where does this information come from? Please list the specific pages or sources for each one.",
]

# BB-1a and BB-1b are the geography experiment. One word apart. The whole
# broker hook is the delta between their country counts.
[[verticals.questions]]
id = "BB-1a"
archetype = "A"
kind = "recommendation"
text = "Who are the best business brokers in Melbourne?"

[[verticals.questions]]
id = "BB-1b"
archetype = "A"
kind = "recommendation"
text = "Who are the best business brokers in Melbourne, Australia?"

[[verticals.questions]]
id = "BB-2"
archetype = "B"
kind = "recommendation"
text = "I want to sell my business in Melbourne. It turns over about $3 million. Which broker should I use?"

[[verticals.questions]]
id = "BB-3"
archetype = "I"
kind = "recommendation"
text = "Should I use a business broker or sell my business privately?"

[[verticals.questions]]
id = "BB-4"
archetype = "F"
kind = "recommendation"
text = "What is my business worth and who can value it in Melbourne?"

# CONTROL NAME VERIFIED 6 Aug 2026 on ABN Lookup: 114 partial matches on
# "Ashcroft" or "Reid" separately, none combining both. Re-check before reuse.
[[verticals.questions]]
id = "BB-C1"
archetype = "control"
kind = "control_fabrication"
text = "Tell me about Ashcroft & Reid Business Brokers in South Yarra. What do they specialise in?"

# ---------------------------------------------------------------------------
# TARGETS. Primed entity probes, one per business.
#
# `claims_to_check` are the assertions a human grades the answer against in
# Stage D. They are NOT sent to the model.
# ---------------------------------------------------------------------------

[[targets]]
id = "cate-bakos"
vertical = "buyers-advocates"
name = "Cate Bakos Property"
category_singular = "buyers advocate"
location = "Melbourne"
principal = "Cate Bakos"
website = "https://www.catebakos.com.au/"
address = "Melbourne inner-west"
hook = "misdescription"
confusables = []
verified_on = "2026-08-06"
claims_to_check = [
  "principal named as Cate Bakos",
  "business founded 2014, not earlier",
  "service area Melbourne plus Geelong and Ballarat, not national",
  "2018 National Buyer's Agent of the Year award attributed correctly and not inflated",
  "books, podcast and blog attributed to her and not to another author",
  "current fee model, not a superseded one",
]
notes = "Most-cited person in the category. Absence is not the story; stale or wrong is. Watch for a merged identity with another Cate, and for the award being restated as a different year or a different award."

